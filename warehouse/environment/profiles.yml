sea_warehouse:
  target: isolated
  outputs:
    isolated:
      type: clickhouse
      driver: http
      host: "{{ env_var('WAREHOUSE_CH_HOST', '127.0.0.1') }}"
      port: "{{ env_var('WAREHOUSE_CH_PORT', '18123') | int }}"
      user: default
      password: ''
      schema: "{{ env_var('WAREHOUSE_GENERATION_SCHEMA') }}"
      secure: false
      threads: 2
      connect_timeout: 10
      send_receive_timeout: 60
      custom_settings:
        join_use_nulls: 1
