name: go
on:
  push:
    branches: ["**"]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - name: Build
        run: go build ./...
      - name: Vet
        run: go vet ./...
      - name: Unit tests (race)
        # Skip two tests with a confirmed upstream data race inside
        # trpc-agent-go v1.10.0 (session.Clone vs steer.Queue.Close).
        # The package still runs without -race in the next step.
        run: go test -race -count=1 -short -skip 'TestFrameworkNativeSpansShareRuntimeTrace|TestOpenAIModelRunnerLifecycle' ./...
      - name: Unit tests (runtime package without race)
        run: go test -count=1 ./service/common/runtime/...
