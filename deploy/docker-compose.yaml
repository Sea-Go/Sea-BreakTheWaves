name: btw
x-env: &env
  BTW_DATACENTER_URL: ${BTW_DATACENTER_URL:?set BTW_DATACENTER_URL}
  DATACENTER_WORKLOAD_TOKEN_FILE: /run/secrets/datacenter_workload_token
  BTW_POSTGRES_DSN: postgres://btw:${BTW_POSTGRES_PASSWORD:?set BTW_POSTGRES_PASSWORD}@postgres:5432/btw?sslmode=disable
  BTW_S3_ENDPOINT: minio:9000
  BTW_S3_ACCESS_KEY: ${BTW_S3_ACCESS_KEY:?set BTW_S3_ACCESS_KEY}
  BTW_S3_SECRET_KEY: ${BTW_S3_SECRET_KEY:?set BTW_S3_SECRET_KEY}
  BTW_MILVUS_ADDRESS: milvus:19530
  BTW_ELASTICSEARCH_URL: http://elasticsearch:9200
  BTW_ELASTICSEARCH_USER: elastic
  BTW_ELASTICSEARCH_PASSWORD: ${BTW_ELASTICSEARCH_PASSWORD:?set BTW_ELASTICSEARCH_PASSWORD}
  BTW_NEO4J_URI: bolt://neo4j:7687
  BTW_NEO4J_USER: neo4j
  BTW_NEO4J_PASSWORD: ${BTW_NEO4J_PASSWORD:?set BTW_NEO4J_PASSWORD}
  BTW_MILVUS_TOKEN: ""
  BTW_OTLP_ENDPOINT: ${BTW_OTLP_ENDPOINT:-}
  BTW_CLICKHOUSE_USER: btw
  BTW_CLICKHOUSE_PASSWORD: ${BTW_CLICKHOUSE_PASSWORD:?set BTW_CLICKHOUSE_PASSWORD}
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.135.0
    profiles: [observability]
    command: [--config=/etc/otel.yaml]
    volumes: [./otel-collector-config.yaml:/etc/otel.yaml:ro]
  jaeger:
    image: jaegertracing/all-in-one:1.74.0
    profiles: [observability]
    ports: [127.0.0.1:16686:16686]
  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: [observability]
    volumes: [./prometheus/settings.yml:/etc/prometheus/prometheus.yml:ro]
    ports: [127.0.0.1:9090:9090]
  postgres:
    image: postgres:16.14
    environment:
      POSTGRES_USER: btw
      POSTGRES_DB: btw
      POSTGRES_PASSWORD: ${BTW_POSTGRES_PASSWORD:?set BTW_POSTGRES_PASSWORD}
    volumes: [btw_postgres:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U btw -d btw"]
      interval: 5s
      retries: 20
  minio:
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    command: server /data --console-address :9001
    environment:
      MINIO_ROOT_USER: ${BTW_S3_ACCESS_KEY:?set BTW_S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${BTW_S3_SECRET_KEY:?set BTW_S3_SECRET_KEY}
    volumes: [btw_objects:/data]
  object-init:
    image: minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on: [minio]
    environment:
      BTW_S3_ACCESS_KEY: ${BTW_S3_ACCESS_KEY}
      BTW_S3_SECRET_KEY: ${BTW_S3_SECRET_KEY}
    entrypoint: [/bin/sh, -c]
    command: ['until mc alias set local http://minio:9000 "$$BTW_S3_ACCESS_KEY" "$$BTW_S3_SECRET_KEY"; do sleep 2; done; mc mb --ignore-existing local/btw']
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    command: [etcd, --advertise-client-urls=http://etcd:2379, --listen-client-urls=http://0.0.0.0:2379, --data-dir=/etcd]
    volumes: [btw_etcd:/etcd]
  milvus:
    image: milvusdb/milvus:v2.6.8
    command: [milvus, run, standalone]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      MINIO_ADDRESS: minio:9000
      MINIO_ACCESS_KEY_ID: ${BTW_S3_ACCESS_KEY}
      MINIO_SECRET_ACCESS_KEY: ${BTW_S3_SECRET_KEY}
    depends_on: [etcd, minio]
    volumes:
      - btw_milvus:/var/lib/milvus
      - ./milvus.yaml:/milvus/configs/user.yaml:ro
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.5.4
    environment:
      discovery.type: single-node
      xpack.security.http.ssl.enabled: "false"
      ELASTIC_PASSWORD: ${BTW_ELASTICSEARCH_PASSWORD:?set BTW_ELASTICSEARCH_PASSWORD}
      ES_JAVA_OPTS: -Xms1g -Xmx1g
    volumes: [btw_elasticsearch:/usr/share/elasticsearch/data]
  neo4j:
    image: neo4j:2026.09.0
    environment:
      NEO4J_AUTH: neo4j/${BTW_NEO4J_PASSWORD:?set BTW_NEO4J_PASSWORD}
    volumes: [btw_neo4j:/data]
  kafka:
    image: apache/kafka:3.9.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
    volumes: [btw_kafka:/tmp/kraft-combined-logs]
  clickhouse:
    image: clickhouse/clickhouse-server:25.8
    environment:
      CLICKHOUSE_DB: btw
      CLICKHOUSE_USER: btw
      CLICKHOUSE_PASSWORD: ${BTW_CLICKHOUSE_PASSWORD}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [btw_clickhouse:/var/lib/clickhouse]
  api:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: api
    environment: *env
    ports: [127.0.0.1:20731:20731]
    depends_on:
      postgres: {condition: service_healthy}
      object-init: {condition: service_completed_successfully}
      milvus: {condition: service_started}
      elasticsearch: {condition: service_started}
      neo4j: {condition: service_started}
    volumes: [./btw-container.yaml:/app/etc/btw-api.yaml:ro]
    secrets: [datacenter_workload_token]
  worker:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: worker
    command: [-command, process]
    environment: *env
    volumes:
      - ./btw-container.yaml:/app/etc/btw-api.yaml:ro
    secrets: [datacenter_workload_token]
    depends_on: [postgres, milvus, elasticsearch, neo4j, object-init]
  ingest:
    extends: worker
    command: [-command, consume]
  feedback-export:
    extends: worker
    command: [-command, export-feedback]
  feedback-aggregate:
    extends: worker
    command: [-command, aggregate-feedback]
volumes:
  btw_postgres: {}
  btw_objects: {}
  btw_etcd: {}
  btw_milvus: {}
  btw_kafka: {}
  btw_clickhouse: {}
  btw_elasticsearch: {}
  btw_neo4j: {}
secrets:
  datacenter_workload_token:
    file: ${DATACENTER_WORKLOAD_TOKEN_FILE:?set DATACENTER_WORKLOAD_TOKEN_FILE}
