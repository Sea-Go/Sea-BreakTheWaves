[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sea-training"
version = "0.2.0"
description = "Immutable Sea warehouse dataset consumer"
requires-python = ">=3.12,<3.13"
dependencies = ["pyarrow>=21,<26", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[project.scripts]
sea-dataset = "sea_training.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sea_training"]

[tool.hatch.build.targets.wheel.force-include]
"../contracts/jsonschema" = "sea_training/schemas"
