[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "sea-training"
version = "0.2.0"
description = "Immutable Sea warehouse dataset consumer"
requires-python = ">=3.12,<3.13"
dependencies = ["pyarrow>=21,<26", "jsonschema>=4.23,<5"]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[project.scripts]
sea-dataset = "sea_training.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/sea_training"]

# The sdist carries a generated snapshot of the one authoritative repository
# directory. A wheel built from that sdist must use the snapshot, while a
# direct wheel reads the same repository directory via the build hook.
[tool.hatch.build.targets.sdist.force-include]
"../contracts/jsonschema" = "contracts/jsonschema"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
