[project]
name = "sea-bge-m3-serving"
version = "0.1.0"
description = "Fixed BGE-M3 provider for Sea typed representations"
requires-python = ">=3.12,<3.13"
dependencies = [
  "FlagEmbedding==1.3.5",
  "torch==2.6.0",
  "transformers==4.44.2",
  "sentence-transformers==3.3.1",
  "peft==0.13.2",
  "accelerate==0.34.2",
  "datasets==2.21.0",
  "huggingface-hub==0.26.5",
  "numpy==1.26.4",
  "sentencepiece==0.2.0",
  "protobuf==5.29.5",
]
[dependency-groups]
dev = ["pytest==9.1.1"]
[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"
[tool.hatch.build.targets.wheel]
packages = ["src/sea_bge_m3"]
[tool.pytest.ini_options]
testpaths = ["tests"]
[project.scripts]
sea-bge-m3 = "sea_bge_m3.server:main"
